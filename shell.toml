[shell]
name = "construct"
description = "Shell cyberpunk / Matrix para Hyprland: fósforo verde, katakana y esquinas recortadas"
version = "0.1.0"
engine = "quickshell"

[packages]
repo = ["quickshell", "upower", "networkmanager", "wl-clipboard", "fd", "xdg-utils",
        "pipewire", "brightnessctl", "bluez-utils", "hyprsunset", "cliphist", "wtype", "jq", "noto-fonts-emoji",
        "grim", "slurp", "wf-recorder", "libnotify", "libpulse"]
aur = []

[ipc]
bar = "qs -c construct ipc call bar toggle"
launcher = "qs -c construct ipc call launcher toggle"
volume_up = "qs -c construct ipc call audio up"
volume_down = "qs -c construct ipc call audio down"
volume_mute = "qs -c construct ipc call audio mute"
bright_up = "qs -c construct ipc call brightness up"
bright_down = "qs -c construct ipc call brightness down"
settings = "qs -c construct ipc call control toggle"
lock = "qs -c construct ipc call lock lock"
session = "qs -c construct ipc call session toggle"
notifs_clear = "qs -c construct ipc call notifs clear"
clipboard = "qs -c construct ipc call clipboard toggle"
emoji = "qs -c construct ipc call emoji toggle"
emoji_all = "qs -c construct ipc call emoji all"
shot_screen = "qs -c construct ipc call capture screen"
shot_region = "qs -c construct ipc call capture region"
shot_window = "qs -c construct ipc call capture window"
rec_region = "qs -c construct ipc call capture record"
rec_screen = "qs -c construct ipc call capture recordScreen"
rec_sound = "qs -c construct ipc call capture recordSound"
media_toggle = "qs -c construct ipc call media toggle"
media_next = "qs -c construct ipc call media next"
media_prev = "qs -c construct ipc call media previous"
media_stop = "qs -c construct ipc call media stop"

[conflicts]
shells = ["velvet", "ancient"]

[hooks]
install = "hooks/install.sh"
uninstall = "hooks/uninstall.sh"

[hyprland]
config = "hypr/shell.lua"